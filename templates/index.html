<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudyHub</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1 id="title">Study Hub</h1>
            <nav>
                <ul>
                    {% if current_user.is_authenticated %}
                        {% if request.endpoint != 'index' %}
                            <li><a href="{{ url_for('index') }}" class="nostyle">Home</a></li>
                        {% endif %}
                        <li><a href="{{ url_for('logout') }}" class="nostyle">Logout</a></li>
                        {% else %}
                        <li><a href="{{ url_for('login') }}" class="nostyle">Login</a></li>
                        <li><a href="{{ url_for('register') }}" class="nostyle">Register</a></li>
                    {% endif %}
                </ul>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p>This was made to facilitate managing online classes</p>
            <p>made by MinaHanna46 :D</p>
        </footer>
    </body>
</html>
