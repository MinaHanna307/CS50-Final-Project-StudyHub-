{% extends 'index.html' %}
{% block content %}
<form action="/submit" method="post">
    {% if course %}
    <input type="hidden" name="originalName" value="{{ course.name }}">
    {% endif %}
    <div class="mb-3">
        <label for="courseName" class="form-label">Course Name</label>
        <input type="text" class="form-control" id="courseName" name="courseName" required value="{% if course %}{{ course.name }}{% endif %}">
    </div>
    <div class="mb-3">
        <label for="courseDescription" class="form-label">Course Description</label>
        <textarea class="form-control" id="courseDescription" name="courseDescription" rows="3" required>{% if course %}{{ course.description }}{% endif %}</textarea>
    </div>
    <div class="mb-3">
        <label for="courseLinks" class="form-label">Course Links (optional)</label>
        <textarea class="form-control" id="courseLinks" name="courseLinks" rows="2">{% if course %}{{ course.links }}{% endif %}</textarea>
    </div>
    <div class="mb-3">
        <label for="courseDay" class="form-label">Day of the Week</label>
        <select class="form-select" id="courseDay" name="courseDay" required>
            <option value="" disabled {% if not course %}selected{% endif %}>Select a day</option>
            <option value="Monday" {% if course and course.day == 'Monday' %}selected{% endif %}>Monday</option>
            <option value="Tuesday" {% if course and course.day == 'Tuesday' %}selected{% endif %}>Tuesday</option>
            <option value="Wednesday" {% if course and course.day == 'Wednesday' %}selected{% endif %}>Wednesday</option>
            <option value="Thursday" {% if course and course.day == 'Thursday' %}selected{% endif %}>Thursday</option>
            <option value="Friday" {% if course and course.day == 'Friday' %}selected{% endif %}>Friday</option>
            <option value="Saturday" {% if course and course.day == 'Saturday' %}selected{% endif %}>Saturday</option>
            <option value="Sunday" {% if course and course.day == 'Sunday' %}selected{% endif %}>Sunday</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
{% endblock %}
